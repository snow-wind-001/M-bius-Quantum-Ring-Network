<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="unitaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06d6a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="loraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="readoutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="700" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Möbius Quantum Ring (MQR) Network Architecture</text>
  <text x="450" y="65" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Unistochastic Hamiltonian Ring Dynamics</text>
  
  <!-- Central Ring (The Möbius Ring) -->
  <g transform="translate(450, 350)">
    <!-- Ring outer glow -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#6366f1" stroke-width="40" stroke-opacity="0.1" filter="url(#glow)"/>
    
    <!-- Main ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="20" stroke-opacity="0.8"/>
    
    <!-- Ring nodes (N hidden nodes) -->
    <g id="ringNodes">
      <circle cx="150" cy="0" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="130" cy="75" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="75" cy="130" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="150" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-75" cy="130" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-130" cy="75" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-150" cy="0" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-130" cy="-75" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-75" cy="-130" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="-150" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="75" cy="-130" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
      <circle cx="130" cy="-75" r="12" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
    </g>
    
    <!-- Ring state label -->
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">h ∈ ℝᴺ</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Ring State</text>
    
    <!-- Relaxation arrows (internal dynamics) -->
    <path d="M 100,-100 Q 50,-50 100,-0" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
    <path d="M -100,100 Q -50,50 -100,0" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  </g>
  
  <!-- Sampled nodes highlight (Local Projective Sampling) -->
  <g transform="translate(450, 350)">
    <circle cx="150" cy="0" r="16" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2"/>
    <circle cx="130" cy="75" r="16" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2"/>
    <circle cx="75" cy="130" r="16" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="170" cy="100" font-family="Arial, sans-serif" font-size="10" fill="#f87171">h_S (Sampled)</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#818cf8"/>
    </marker>
  </defs>
  
  <!-- Cayley Unistochastic Param Module (Top) -->
  <g transform="translate(450, 100)">
    <rect x="-120" y="-30" width="240" height="60" rx="10" fill="#1f2937" stroke="url(#unitaryGrad)" stroke-width="2"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">CayleyUnistochasticParam</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">U = (I-A)(I+A)⁻¹  |  H = |U|²</text>
  </g>
  
  <!-- Connection: Cayley → Ring (H matrix) -->
  <path d="M 450,130 L 450,195" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="470" y="170" font-family="Arial, sans-serif" font-size="11" fill="#10b981">H (doubly stochastic)</text>
  
  <!-- Input Module (Left) -->
  <g transform="translate(100, 350)">
    <rect x="-80" y="-60" width="160" height="120" rx="10" fill="#1f2937" stroke="url(#loraGrad)" stroke-width="2"/>
    <text x="0" y="-35" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="bold">Input x</text>
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[B, C×H×W]</text>
    
    <rect x="-60" y="-5" width="120" height="35" rx="5" fill="#292524" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="bold">HamiltonianInjectionLoRA</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">J(x) = W_up · W_down · x</text>
    
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">LoRA rank r = 16</text>
  </g>
  
  <!-- Connection: Input → Ring (Injection) -->
  <path d="M 180,350 L 290,350" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="235" y="340" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">J(x) injection</text>
  
  <!-- Output Module (Right) -->
  <g transform="translate(800, 350)">
    <rect x="-80" y="-60" width="160" height="120" rx="10" fill="#1f2937" stroke="url(#readoutGrad)" stroke-width="2"/>
    <text x="0" y="-35" font-family="Arial, sans-serif" font-size="12" fill="#ef4444" text-anchor="middle" font-weight="bold">Output y</text>
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[B, num_classes]</text>
    
    <rect x="-60" y="-5" width="120" height="35" rx="5" fill="#292524" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="10" fill="#f87171" text-anchor="middle" font-weight="bold">LocalProjectiveReadout</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">y = W_readout · h*_S</text>
    
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Sampling |S| = 16 nodes</text>
  </g>
  
  <!-- Connection: Ring → Output (Readout) -->
  <path d="M 610,350 L 720,350" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="665" y="340" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">h*_S sample</text>
  
  <!-- Relaxation Equation Box -->
  <g transform="translate(450, 550)">
    <rect x="-200" y="-40" width="400" height="80" rx="10" fill="#1f2937" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="-15" font-family="Arial, sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="bold">Fixed-Point Relaxation (Inference)</text>
    <text x="0" y="10" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle">h ← (1-α)·h·Hᵀ + α·J(x)</text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Iterate K steps until convergence to h* (Banach Fixed Point)</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 620)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Legend:</text>
    <circle cx="10" cy="20" r="6" fill="#10b981"/>
    <text x="25" y="24" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Unitary Param (Cayley)</text>
    <circle cx="150" cy="20" r="6" fill="#f59e0b"/>
    <text x="165" y="24" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">LoRA Injection</text>
    <circle cx="280" cy="20" r="6" fill="#ef4444"/>
    <text x="295" y="24" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Local Sampling</text>
    <circle cx="410" cy="20" r="6" fill="#a78bfa"/>
    <text x="425" y="24" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Ring Nodes (N=384)</text>
  </g>
  
  <!-- Key Properties -->
  <g transform="translate(730, 620)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#6366f1">✓ H = |U|² auto doubly-stochastic</text>
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" fill="#6366f1">✓ Energy conserved (no gradient explosion)</text>
    <text x="0" y="36" font-family="Arial, sans-serif" font-size="11" fill="#6366f1">✓ No Sinkhorn iteration needed</text>
  </g>
</svg>
